<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/login.css">
    <title>Página de login | MinAuuu Petshop</title>
</head>

<body>
      <header>
    <div class="page_header">
        <div class="back_icon">
            <a href="index.html"><img src="../img/back_icon1.png" alt="Ícone do usuário"></a>
        </div>
        <img class="logo_header" src="../img/logo_transp.png" alt="logo da loja Mii Auuu petshop">
    </div>
  </header>

  <main>
    <form action="index.html">
        <h1>Login</h1>
        <fieldset class="login_fields">

            <div class="data_field">
                <label for="email">Insira seu Email:</label>
                <input type="email" name="email" id="email" placeholder="Seu nome" required>
            </div>

            <div class="data_field">
                <label for="password">Digite sua senha:</label>
                <input type="password" name="senha" id="password" placeholder="Aabcde123." required>
            </div>
        </fieldset>

        <div class="redirect_box">
            <p>É novo aqui?</p><a href="cadastro.html" class="redirect" > Cadastre-se</a>
        </div>

        <button type="submit" class="">Entrar </button>
        
    </form>
  </main>
    
</body>
</html>
